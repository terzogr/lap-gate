<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lap Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="flag">🏁</span>
      <h1>Lap Gate</h1>
    </div>
    <div class="header-right">
      <span class="sync-dot" id="syncDot" title="Sync status"></span>
      <div class="status" id="statusText">idle</div>
    </div>
  </header>

  <div class="field-row">
    <input id="trackInput" placeholder="Track name" maxlength="30" value="Home track" list="trackHistory">
    <datalist id="trackHistory"></datalist>
  </div>
  <div class="pills" id="trackPills"></div>

  <div class="field-row">
    <input id="driverInput" placeholder="Driver name" maxlength="24" value="Driver 1">
    <button id="driverGoBtn">Set</button>
  </div>
  <div class="pills" id="driverPills"></div>

  <div class="camera-card">
    <div class="camera-wrap" id="camWrap">
      <video id="video" autoplay playsinline webkit-playsinline muted></video>
      <canvas class="overlay" id="overlay"></canvas>
      <div class="cam-msg" id="camMsg">
        Point the camera so the finish line falls across the gate, then drag the line to match it.
        <div><button class="btn-reset" id="startCamBtn">Enable camera</button></div>
      </div>
      <div class="cam-controls">
        <select class="chip" id="camSelect" style="display:none;"></select>
        <button class="chip" id="orientBtn">↕ Horizontal</button>
        <button class="chip" id="flipBtn">⟲ Flip</button>
      </div>
    </div>
    <div class="meter-wrap">
      <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat laps">
      <div class="label">LAPS</div>
      <div class="value" id="lapCount">0</div>
    </div>
    <div class="stat">
      <div class="label">LAST LAP</div>
      <div class="value small" id="lastLap">—</div>
    </div>
    <div class="stat">
      <div class="label">BEST</div>
      <div class="value small best" id="bestLap">—</div>
    </div>
  </div>

  <div class="laps-panel" id="lapsPanel">
    <div class="empty">Laps will appear here once you start.</div>
  </div>

  <details class="calib" open>
    <summary>This session<span id="lbSummary" style="font-weight:400;">1 driver</span></summary>
    <div id="lbList" class="lb-list"></div>
  </details>

  <details class="calib">
    <summary>All-time on this track<span id="atSummary" style="font-weight:400;">—</span></summary>
    <div id="atList" class="lb-list"></div>
  </details>

  <div class="controls">
    <div class="primary-row">
      <button class="btn-main" id="mainBtn">Start</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
    <details class="calib">
      <summary>Calibrate<span id="calibSummary" style="font-weight:400;">sensitivity 50 · min gap 1.5s</span></summary>
      <div class="calib-row">
        <div class="row-label"><span>Sensitivity</span><span id="sensVal">50</span></div>
        <input type="range" id="sensSlider" min="1" max="100" value="50">
      </div>
      <div class="calib-row">
        <div class="row-label"><span>Min. time between laps</span><span id="gapVal">1.5s</span></div>
        <input type="range" id="gapSlider" min="3" max="50" value="15">
      </div>
    </details>
  </div>

</div>

<canvas id="sample" width="160" height="90" style="display:none;"></canvas>

<script type="module" src="app.js"></script>
</body>
</html>
